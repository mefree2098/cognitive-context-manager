name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, lint, and test
        run: npm run check

      - name: Run production audit
        run: npm audit --omit=dev

      - name: Run CCM doctor
        env:
          CCM_HOME: ${{ runner.temp }}/ccm-home
        run: |
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          [features]
          hooks = true
          memories = true
          EOF
          node dist/cli/ccm.js init
          node dist/cli/ccm.js doctor

      - name: Verify package contents
        run: npm pack --dry-run
